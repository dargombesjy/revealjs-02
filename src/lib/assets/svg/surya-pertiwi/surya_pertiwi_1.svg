<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 768" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">SAP Build Process Automation integration flow</title>
  <desc id="diagram-description">An external sales application triggers an automation on SAP BTP. The process connects to SAP S/4HANA through APIs and, for private systems, SAP Cloud Connector. An optional desktop agent handles UI automation. Monitoring and a manual PGI step are shown.</desc>
  <defs>
    <linearGradient id="bpa-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a12b83"/>
    </linearGradient>
    <linearGradient id="btp-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4faff"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#153b5b" flood-opacity=".09"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1687cc"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8050a5"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .heading { fill: #163b5c; font-size: 28px; font-weight: 700; }
      .subheading { fill: #587189; font-size: 14px; }
      .eyebrow { fill: #6f8295; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
      .actor-title { fill: #193e5d; font-size: 18px; font-weight: 700; }
      .actor-copy { fill: #647b90; font-size: 12px; }
      .small-label { fill: #55718b; font-size: 11px; font-weight: 600; }
      .node-title { fill: #263f59; font-size: 14px; font-weight: 700; }
      .node-copy { fill: #61788d; font-size: 11px; }
      .number { fill: #fff; font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .connector { fill: none; stroke: #1687cc; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .connector-dashed { fill: none; stroke: #1687cc; stroke-width: 2.25; stroke-dasharray: 7 6; marker-end: url(#arrow-blue); }
      .bpa-connector { fill: none; stroke: #8050a5; stroke-width: 2.5; marker-end: url(#arrow-violet); }
    </style>
  </defs>

  <rect width="1360" height="768" fill="#fff"/>
  <text class="eyebrow" x="56" y="49">SAP BUILD PROCESS AUTOMATION</text>
  <text class="heading" x="56" y="88">Automate across your enterprise landscape</text>
  <text class="subheading" x="56" y="116">Connect business events, SAP processes, and desktop tasks with governed automation on SAP BTP.</text>

  <!-- External business application -->
  <g filter="url(#card-shadow)">
    <rect x="48" y="269" width="208" height="142" rx="12" fill="#fff" stroke="#d7e4ef" stroke-width="1.5"/>
    <path d="M60 269h184a12 12 0 0 1 12 12v3H48v-3a12 12 0 0 1 12-12" fill="#e8f4fc"/>
    <circle cx="70" cy="292" r="6" fill="#1687cc"/>
    <text class="eyebrow" x="86" y="296">EXTERNAL APPLICATION</text>
    <text class="actor-title" x="68" y="336">Sales App</text>
    <text class="actor-copy" x="68" y="358">Creates a sales order</text>
    <rect x="68" y="375" width="167" height="23" rx="11.5" fill="#f1f7fc"/>
    <text class="small-label" x="81" y="391">API request · order data</text>
  </g>

  <!-- SAP BTP boundary -->
  <rect x="294" y="163" width="606" height="437" rx="18" fill="url(#btp-gradient)" stroke="#91c9ec" stroke-width="2"/>
  <rect x="294" y="163" width="606" height="52" rx="18" fill="#e1f1fc"/>
  <path d="M294 197v18h606v-18" fill="#e1f1fc"/>
  <g transform="translate(316 180)">
    <path d="M0 18 10 0h10L10 18zM15 18 25 0h10L25 18z" fill="#1687cc"/>
  </g>
  <text x="360" y="194" fill="#22577d" font-size="13" font-weight="700" letter-spacing="1">SAP BUSINESS TECHNOLOGY PLATFORM</text>

  <!-- Trigger and process -->
  <g filter="url(#card-shadow)">
    <rect x="326" y="244" width="542" height="218" rx="13" fill="#fff" stroke="#e0e8f0"/>
    <rect x="326" y="244" width="542" height="8" rx="4" fill="url(#bpa-gradient)"/>
  </g>
  <rect x="350" y="273" width="194" height="151" rx="10" fill="#faf6fc" stroke="#eadcf1"/>
  <rect x="368" y="291" width="32" height="32" rx="9" fill="#f0e4f5"/>
  <path d="M378 307h12m-6-6v12" stroke="#8050a5" stroke-width="2" stroke-linecap="round"/>
  <text class="eyebrow" x="410" y="311" fill="#8050a5">1 · START</text>
  <text class="node-title" x="368" y="349">Automation trigger</text>
  <text class="node-copy" x="368" y="371">API call or schedule</text>
  <text class="node-copy" x="368" y="391">Starts the business process</text>

  <path class="bpa-connector" d="M550 348h35"/>
  <rect x="596" y="273" width="248" height="151" rx="10" fill="#fff" stroke="#e5d9ed"/>
  <rect x="614" y="291" width="32" height="32" rx="9" fill="#f0e4f5"/>
  <path d="M623 301h14M623 307h14M623 313h9" stroke="#8050a5" stroke-width="2" stroke-linecap="round"/>
  <text class="eyebrow" x="656" y="311" fill="#8050a5">2 · ORCHESTRATE</text>
  <text class="node-title" x="614" y="349">Process &amp; Action Group</text>
  <text class="node-copy" x="614" y="371">Manage steps, data, and decisions</text>
  <rect x="614" y="386" width="102" height="23" rx="11.5" fill="#f4edf8"/>
  <text x="628" y="402" fill="#75448e" font-size="10" font-weight="700">Deployed automation</text>

  <!-- Monitoring -->
  <rect x="326" y="484" width="542" height="82" rx="11" fill="#fff" stroke="#dbe6ef"/>
  <circle cx="357" cy="525" r="17" fill="#e8f4fc"/>
  <path d="M347 526h5l4-8 5 14 4-7h5" fill="none" stroke="#1687cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="node-title" x="388" y="520">Monitoring &amp; governance</text>
  <text class="node-copy" x="388" y="541">Track automation status, execution, and exceptions</text>
  <rect x="751" y="510" width="91" height="28" rx="14" fill="#eef7fd"/>
  <circle cx="766" cy="524" r="4" fill="#1c9b78"/>
  <text x="777" y="528" fill="#3d6d85" font-size="10" font-weight="700">Observable</text>

  <!-- SAP system -->
  <g filter="url(#card-shadow)">
    <rect x="1042" y="248" width="270" height="224" rx="12" fill="#fff" stroke="#d7e4ef" stroke-width="1.5"/>
  </g>
  <rect x="1042" y="248" width="270" height="46" rx="12" fill="#0a6ed1"/>
  <path d="M1042 282v12h270v-12" fill="#0a6ed1"/>
  <text x="1064" y="277" fill="#fff" font-size="11" font-weight="700" letter-spacing="1">SAP ERP</text>
  <text x="1064" y="329" fill="#173b5c" font-size="20" font-weight="700">S/4HANA</text>
  <text class="actor-copy" x="1064" y="350">Business data &amp; processes</text>
  <line x1="1064" y1="365" x2="1290" y2="365" stroke="#e5edf3"/>
  <circle cx="1071" cy="387" r="3" fill="#1687cc"/>
  <text class="node-copy" x="1082" y="391">OData APIs · BAPIs</text>
  <circle cx="1071" cy="411" r="3" fill="#1687cc"/>
  <text class="node-copy" x="1082" y="415">Custom API / remote FM</text>
  <circle cx="1071" cy="435" r="3" fill="#1687cc"/>
  <text class="node-copy" x="1082" y="439">Custom table · shipper data</text>

  <!-- API path -->
  <path class="connector" d="M256 339h70"/>
  <circle cx="284" cy="339" r="13" fill="#1687cc"/>
  <text class="number" x="284" y="339">1</text>
  <path class="connector" d="M868 335h162"/>
  <circle cx="923" cy="335" r="13" fill="#1687cc"/>
  <text class="number" x="923" y="335">2</text>
  <rect x="906" y="359" width="123" height="44" rx="7" fill="#fff" stroke="#d5e4ef"/>
  <text x="967.5" y="377" text-anchor="middle" fill="#41647f" font-size="10" font-weight="700">OData · BAPI</text>
  <text x="967.5" y="392" text-anchor="middle" fill="#71869a" font-size="9">request / response</text>

  <!-- Optional private connectivity -->
  <rect x="922" y="421" width="98" height="39" rx="7" fill="#f5f9fc" stroke="#cddce8"/>
  <text x="971" y="438" text-anchor="middle" fill="#45657f" font-size="9" font-weight="700">Cloud Connector</text>
  <text x="971" y="451" text-anchor="middle" fill="#74899b" font-size="8">if private landscape</text>
  <path d="M900 440h16M1020 440h22" stroke="#8ea8bb" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Optional attended or unattended desktop automation -->
  <path class="connector-dashed" d="M744 462v117h279"/>
  <circle cx="744" cy="489" r="13" fill="#1687cc"/>
  <text class="number" x="744" y="489">3</text>
  <g filter="url(#card-shadow)">
    <rect x="1042" y="521" width="270" height="91" rx="11" fill="#fff" stroke="#ded2ea" stroke-width="1.5"/>
  </g>
  <rect x="1060" y="540" width="38" height="38" rx="11" fill="#f4eaf7"/>
  <path d="M1069 556a10 10 0 0 1 20 0v7h-20zM1074 565v3m10-3v3" fill="none" stroke="#8050a5" stroke-width="2" stroke-linecap="round"/>
  <text class="eyebrow" x="1110" y="546" fill="#8050a5">OPTIONAL UI AUTOMATION</text>
  <text class="node-title" x="1110" y="568">Desktop / RPA Agent</text>
  <text class="node-copy" x="1110" y="588">For steps without a suitable API</text>
  <path class="connector-dashed" d="M1177 521v-39"/>
  <text x="1191" y="506" fill="#6d8295" font-size="9">UI task</text>

  <!-- Human-in-the-loop action -->
  <rect x="48" y="493" width="208" height="78" rx="10" fill="#fffaf0" stroke="#f0dfb8"/>
  <circle cx="72" cy="522" r="12" fill="#f9edcf"/>
  <path d="M67 523a5 5 0 1 1 10 0m-12 10c1-4 3-6 7-6s6 2 7 6" fill="none" stroke="#a57825" stroke-width="1.5" stroke-linecap="round"/>
  <text class="eyebrow" x="94" y="518" fill="#94702f">HUMAN STEP</text>
  <text class="node-title" x="94" y="541">Manual PGI</text>
  <text class="node-copy" x="94" y="557">Goods issue confirmation</text>
  <path class="connector-dashed" d="M256 532h45v-70h400v-8"/>

  <!-- Footer guidance -->
  <rect x="48" y="655" width="1264" height="1" fill="#e4edf4"/>
  <circle cx="61" cy="689" r="9" fill="#eaf4fb"/>
  <text x="61" y="693" text-anchor="middle" fill="#1687cc" font-size="11" font-weight="700">i</text>
  <text x="80" y="693" fill="#60778c" font-size="11">
    Illustrative pattern: use APIs where suitable; Cloud Connector and a desktop agent apply when required by the system landscape and process.
  </text>
</svg>
